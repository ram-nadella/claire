name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      # The extension has no build step, so src/ is the unpacked extension.
      - name: Upload the unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: claire-extension
          path: src/
          if-no-files-found: error
