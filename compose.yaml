# Dev container for Claire (has outbound network access via the default compose network).
#
#   docker compose run --rm dev yarn test        # lint + unit tests
#   docker compose run --rm dev yarn build       # build the unpacked extension into dist/
#   docker compose run --rm dev                  # interactive shell
#   docker compose run --rm -T dev yarn test     # non-interactive (agents, scripts): -T = no TTY
#
# The repo is bind-mounted at /app, so edits on the host are seen immediately and dist/
# lands on the host. node_modules lives in a named volume so the Linux install never mixes
# with a macOS one. Reset it with: docker compose down -v
services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NODE_VERSION: "16"
    image: claire-dev:node16
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - yarn-cache:/home/node/.cache/yarn
    stdin_open: true
    tty: true

volumes:
  node_modules:
  yarn-cache:
